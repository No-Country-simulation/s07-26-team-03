# ===================================================================
# PHYSAFLOW: CORE ENGINE CONFIGURATION
# ===================================================================

# -------------------------------------------------------------------
# SERVER & VIRTUAL THREADS (Java 21)
# -------------------------------------------------------------------
server.port=8080
spring.threads.virtual.enabled=true

# -------------------------------------------------------------------
# DATASOURCE (PostgreSQL)
# -------------------------------------------------------------------
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:physaflow}?sslmode=${DB_SSL_MODE:prefer}&tcpKeepAlive=true&reWriteBatchedInserts=true
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:admin}
spring.datasource.driver-class-name=org.postgresql.Driver

# -------------------------------------------------------------------
# HIKARICP TUNING (High Concurrency / Viral Traffic)
# -------------------------------------------------------------------
spring.datasource.hikari.maximum-pool-size=40
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=900000
spring.datasource.hikari.pool-name=PhysaFlowHikariPool

# -------------------------------------------------------------------
# FLYWAY (Database Migrations)
# -------------------------------------------------------------------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.out-of-order=false

# -------------------------------------------------------------------
# SPRING DATA JPA & HIBERNATE 6.5+
# -------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

