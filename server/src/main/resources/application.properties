# ===================================================================
# PHYSAFLOW: CORE ENGINE CONFIGURATION
# ===================================================================
spring.config.import=optional:file:.env[.properties]
# -------------------------------------------------------------------
# SERVER & VIRTUAL THREADS (Java 21)
# -------------------------------------------------------------------
server.port=8080
spring.threads.virtual.enabled=true

# -------------------------------------------------------------------
# DATASOURCE (PostgreSQL)
# -------------------------------------------------------------------
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# -------------------------------------------------------------------
# HIKARICP TUNING (High Concurrency / Viral Traffic)
# -------------------------------------------------------------------
spring.datasource.hikari.maximum-pool-size=40
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=900000
spring.datasource.hikari.pool-name=PhysaFlowHikariPool

# -------------------------------------------------------------------
# FLYWAY (Database Migrations)
# -------------------------------------------------------------------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.out-of-order=false

# -------------------------------------------------------------------
# SPRING DATA JPA & HIBERNATE 6.5+
# -------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC


# Frontend configuration
frontend.cors.url=${FRONTEND_CORS_URL:*}
frontend.redirect.url=${FRONTEND_REDIRECT_URL:http://localhost:5173}

# Security settings
api.security.secret=${JWT_SECRET}
jwt.expiration-seconds=3600


# Share configuration
share.default-expiration-days=7

# Email configuration
spring.mail.host=${EMAIL_HOST}
spring.mail.port=${EMAIL_PORT:587}
spring.mail.username=${EMAIL_USER}
spring.mail.password=${EMAIL_PASS}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.timeout=5000

